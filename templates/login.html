<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nortão — Robô de Certidões</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  background:#0f4f1e;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* fundo decorativo */
body::before{
  content:"";
  position:absolute;
  width:600px;height:600px;
  background:rgba(255,255,255,.04);
  border-radius:50%;
  top:-150px;left:-150px;
}
body::after{
  content:"";
  position:absolute;
  width:400px;height:400px;
  background:rgba(255,255,255,.04);
  border-radius:50%;
  bottom:-100px;right:-100px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:48px 44px;
  width:100%;
  max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  position:relative;
  z-index:1;
}

.logo-wrap{
  text-align:center;
  margin-bottom:32px;
}
.logo-wrap img{
  max-width:260px;
  width:100%;
  height:auto;
}
.logo-fallback{
  display:inline-block;
  background:#0f4f1e;
  color:#fff;
  font-size:2rem;
  font-weight:900;
  letter-spacing:2px;
  padding:12px 28px;
  border-radius:10px;
}
.logo-fallback small{
  display:block;
  font-size:.65rem;
  font-weight:400;
  letter-spacing:3px;
  opacity:.8;
  margin-top:4px;
  text-transform:uppercase;
}

.titulo{
  text-align:center;
  color:#1a1a1a;
  font-size:1.05rem;
  font-weight:600;
  margin-bottom:28px;
  padding-bottom:20px;
  border-bottom:1px solid #eee;
}

label{
  display:block;
  font-size:.82rem;
  font-weight:600;
  color:#555;
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.input-wrap{
  position:relative;
  margin-bottom:20px;
}
.input-wrap input{
  width:100%;
  padding:13px 44px 13px 16px;
  border:2px solid #e0e0e0;
  border-radius:10px;
  font-size:.95rem;
  outline:none;
  transition:border-color .2s;
  background:#fafafa;
}
.input-wrap input:focus{
  border-color:#1a7a30;
  background:#fff;
}
.toggle-senha{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  cursor:pointer;
  color:#aaa;
  font-size:1.1rem;
  padding:0;
}
.toggle-senha:hover{color:#555}

.erro{
  background:#fee2e2;
  color:#991b1b;
  border-radius:8px;
  padding:10px 14px;
  font-size:.84rem;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  width:100%;
  padding:14px;
  background:#1a7a30;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  transition:background .2s, transform .1s;
  letter-spacing:.03em;
}
.btn:hover{background:#15692a}
.btn:active{transform:scale(.98)}

.rodape{
  text-align:center;
  margin-top:24px;
  font-size:.78rem;
  color:#bbb;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="/static/logo.png" alt="Nortão Contabilidade"
         onerror="this.style.display='none';document.getElementById('logo-txt').style.display='inline-block'">
    <div class="logo-fallback" id="logo-txt" style="display:none">
      NORTÃO
      <small>Assessoria Contábil e Empresarial</small>
    </div>
  </div>

  <div class="titulo">🤖 Robô de Certidões Negativas</div>

  {% if erro %}
  <div class="erro">⚠️ {{ erro }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <label for="senha">Senha de acesso</label>
    <div class="input-wrap">
      <input type="password" id="senha" name="senha"
             placeholder="Digite a senha do escritório"
             autofocus autocomplete="current-password" required>
      <button type="button" class="toggle-senha" onclick="toggleSenha()" title="Mostrar/ocultar senha">👁</button>
    </div>
    <button type="submit" class="btn">Entrar</button>
  </form>

  <div class="rodape">Nortão Assessoria Contábil e Empresarial</div>
</div>

<script>
function toggleSenha() {
  const inp = document.getElementById("senha");
  inp.type = inp.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
